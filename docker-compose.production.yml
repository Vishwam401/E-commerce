services:

  # ── Reverse proxy + HTTPS (public-facing) ─────────────────
  caddy:
    image: caddy:2-alpine
    container_name: alpha_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
    depends_on:
      - api

  # ── FastAPI backend ────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alpha_api
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - /opt/alpha-commerce/env/production.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  # ── Celery worker (email / invoice tasks) ─────────────────
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alpha_celery
    restart: unless-stopped
    command: celery -A app.worker.celery_app worker --loglevel=info
    environment:
      PYTHONPATH: /app
    env_file:
      - /opt/alpha-commerce/env/production.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  # ── PostgreSQL database ────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: alpha_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alphauser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alphauser} -d ${POSTGRES_DB:-ecommerce_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (Celery broker + cache + blacklist) ──────────────
  redis:
    image: redis:7-alpine
    container_name: alpha_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

# ── Named volumes ──────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

# ── Private network (nothing exposed except Caddy) ─────────
networks:
  internal:
    driver: bridge
